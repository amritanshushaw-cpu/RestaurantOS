<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Point of Sale (POS) & Menu Catalog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/pos.css">
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
    </div>
  </header>

  <main class="app-container" style="max-width: 1320px; width: 100%; box-sizing: border-box; padding: 24px 16px; overflow-x: hidden;">
    <!-- POS Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-cash-register"></i></div>
        <div class="brand-text">
          <h1>Restaurant<span>OS</span> <small style="font-size: 14px; color: var(--text-secondary); font-weight: 500;">/ POS & Menu Terminal</small></h1>
        </div>
      </div>

      <div style="display: flex; gap: 12px; align-items: center;">
        <button id="btn-open-add-dish" type="button" class="btn-ghost-on-dark" style="border: 1px solid var(--color-accent-lime); color: var(--color-accent-lime); padding: 8px 14px; font-size: 12px; text-transform: uppercase; font-weight: 700;">
          <i class="fa-solid fa-plus"></i> Add New Dish
        </button>

        <label for="table-select" style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; color: var(--text-secondary);">Target Table:</label>
        <select id="table-select" style="background: var(--color-ink-deep); border: 1px solid var(--border-violet); color: #fff; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; outline: none; font-weight: 600; font-family: var(--font-sans);">
          <option value="tbl-01">Table 01 (2 Seats)</option>
          <option value="tbl-02" selected>Table 02 (4 Seats)</option>
          <option value="tbl-03">Table 03 (4 Seats)</option>
          <option value="tbl-04">Table 04 (6 Seats)</option>
          <option value="tbl-05">Table 05 (2 Seats)</option>
          <option value="tbl-06">Table 06 (8 Seats)</option>
        </select>
      </div>
    </header>

    <!-- POS Main Grid -->
    <div class="pos-container">
      <section>
        <div class="pos-categories" id="pos-category-bar"></div>

        <div class="pos-menu-grid" id="pos-menu-grid"></div>
      </section>

      <aside class="pos-cart-sidebar">
        <div class="cart-header">
          <h3 style="font-family: var(--font-display); font-size: 16px; font-weight: 700;"><i class="fa-solid fa-basket-shopping" style="color: var(--color-accent-lime);"></i> Active Order Cart</h3>
          <span class="badge sandbox-badge" id="active-table-badge">Table 02</span>
        </div>

        <div class="cart-items-list" id="cart-items-list">
          <p style="text-align: center; color: var(--text-tertiary); margin-top: 40px; font-size: 13px;">Cart is empty. Click any food item to add.</p>
        </div>

        <div style="border-top: 1px solid var(--border-violet); padding-top: 16px;">
          <div style="margin-bottom: 14px;">
            <label for="order-special-instructions" style="display: block; font-size: 11px; font-weight: 700; color: var(--color-warning); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px;">
              <i class="fa-solid fa-utensils"></i> Special Cooking Instructions / Chef Notes
            </label>
            <textarea id="order-special-instructions" placeholder="e.g. Medium rare steak, extra spicy, sauce on the side, no onions..." rows="2" style="width: 100%; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: var(--text-primary); padding: 8px 10px; font-size: 12px; font-family: var(--font-sans); outline: none; resize: vertical;"></textarea>
          </div>

          <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
            <span style="color: var(--text-secondary);">Subtotal</span>
            <strong id="cart-subtotal" style="font-family: var(--font-mono);">₹0.00</strong>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 12px;">
            <span style="color: var(--text-secondary);">Tax (5%)</span>
            <strong id="cart-tax" style="font-family: var(--font-mono);">₹0.00</strong>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
            <span style="font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.2px;">Total Amount</span>
            <span style="font-size: 24px; font-weight: 700; color: var(--color-accent-lime); font-family: var(--font-mono);" id="cart-total">₹0.00</span>
          </div>

          <button type="button" class="pay-btn" id="btn-dispatch-order" disabled>
            Send Order to Kitchen <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </aside>
    </div>
  </main>


  <!-- Add New Dish Modal -->
  <div class="modal-overlay" id="add-dish-modal" style="display: none; position: fixed; inset: 0; background: rgba(15,10,24,0.85); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: var(--color-ink-deep); border: 1px solid var(--border-violet); border-radius: var(--radius-xl); padding: 32px; max-width: 500px; width: 90%; box-shadow: var(--shadow-card);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-family: var(--font-display); font-size: 20px; font-weight: 700;">Add New Menu Item</h3>
        <button id="btn-close-add-dish" type="button" style="background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="add-dish-form">
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Dish Name</label>
          <input type="text" id="dish-name" placeholder="e.g. Chicken Tikka Masala" required style="width: 100%; padding: 10px 14px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Category</label>
          <select id="dish-category" style="width: 100%; padding: 10px 14px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);">
            <option value="cat-05">Indian Specialties</option>
            <option value="cat-01">Starters & Appetizers</option>
            <option value="cat-02">Mains & Steaks</option>
            <option value="cat-03">Drinks & Beverages</option>
            <option value="cat-04">Desserts</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
          <div>
            <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Price (₹ INR)</label>
            <input type="number" step="0.01" id="dish-price" placeholder="450.00" required style="width: 100%; padding: 10px 14px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);">
          </div>
          <div>
            <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Photo URL</label>
            <input type="url" id="dish-photo" placeholder="https://images.unsplash.com/..." style="width: 100%; padding: 10px 14px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Description</label>
          <input type="text" id="dish-desc" placeholder="e.g. Spiced grilled chicken in rich creamy sauce" style="width: 100%; padding: 10px 14px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);">
        </div>

        <button type="submit" class="pay-btn" style="width: 100%;">+ Save Item to Menu</button>
      </form>
    </div>
  </div>

  <!-- Google Identity Services & Auth Modules -->
  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="../services/supabaseClient.js"></script>
  <script type="module" src="../services/authService.js"></script>
  <script type="module" src="../utils/navbarAuth.js"></script>

  <!-- POS Controller Module -->
  <script type="module" src="../controllers/posController.js"></script>
</body>
</html>
