<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Restaurant Digital Twin Floor Plan Map</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .floorplan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .table-twin-card {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 24px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .table-twin-card:hover {
      transform: translateY(-3px);
      border-color: var(--color-accent-lime);
      box-shadow: var(--shadow-card);
    }

    .status-available { border-top: 4px solid var(--color-accent-lime); }
    .status-occupied { border-top: 4px solid var(--color-accent-pink); }
    .status-preparing { border-top: 4px solid var(--color-accent-violet); }
    .status-pending { border-top: 4px solid var(--color-warning); }
    .status-cleaning { border-top: 4px solid var(--border-cool); }

    .health-score-banner {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .score-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 3px solid var(--color-accent-lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--color-accent-lime);
    }

    @media (max-width: 900px) {
      .floorplan-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
    }

    @media (max-width: 600px) {
      .floorplan-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .health-score-banner {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        padding: 18px;
      }
      .table-twin-card {
        padding: 16px;
      }
    }

    @media (max-width: 860px) {
      .floorplan-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Hub</a>
        <a href="digital_twin.html" class="btn-ghost-on-dark active"><i class="fa-solid fa-cubes"></i> Digital Twin</a>
        <a href="pos.html" class="btn-ghost-on-dark"><i class="fa-solid fa-cash-register"></i> POS Terminal</a>
        <a href="kds.html" class="btn-ghost-on-dark"><i class="fa-solid fa-fire"></i> KDS Kitchen</a>
        <a href="opscopilot.html" class="btn-ghost-on-dark"><i class="fa-solid fa-robot"></i> OpsCopilot</a>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 1200px; padding-top: 24px;">
    <!-- Health Score Banner -->
    <div class="health-score-banner">
      <div>
        <div style="font-size: 11px; font-weight: 600; color: var(--color-accent-lime); text-transform: uppercase; letter-spacing: 0.2px; margin-bottom: 6px;">
          <i class="fa-solid fa-heart-pulse"></i> Operational Bottleneck Detection Engine
        </div>
        <h2 style="font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-bottom: 6px;">Restaurant Operational Health Score</h2>
        <p style="font-size: 14px; color: var(--text-secondary);" id="health-detail">Kitchen prep efficiency is optimal. Real-time dynamic table tracking active.</p>
      </div>
      <div class="score-circle" id="health-score">86/100</div>
    </div>

    <!-- Digital Twin Floor Plan Map -->
    <h3 style="font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: 20px;" id="floorplan-heading">
      <i class="fa-solid fa-map-location-dot" style="color: var(--color-accent-lime);"></i> Live Floor Plan Map
    </h3>

    <div class="floorplan-grid" id="floorplan-grid"></div>
  </main>

  <script type="module">
    import { dbEngine } from '../services/supabaseClient.js';

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('floorplan-grid');

      function renderFloorMap() {
        const tables = dbEngine.getTables();
        const orders = dbEngine.getOrders();
        grid.innerHTML = '';
        let availableCount = 0;
        let pendingCount = 0;

        tables.forEach(tbl => {
          const activeOrder = orders.find(o => (o.table_id === tbl.id || o.table_number === tbl.table_number) && o.status !== 'PAID');
          let status = tbl.status || 'AVAILABLE';
          if (activeOrder) {
            if (activeOrder.status === 'NEW' || activeOrder.status === 'PREPARING') status = 'OCCUPIED';
            else if (activeOrder.status === 'READY') status = 'PAYMENT PENDING';
          }

          if (status === 'AVAILABLE') availableCount++;
          if (status === 'PAYMENT PENDING') pendingCount++;

          let borderClass = 'status-available';
          let badgeStyle = 'background: rgba(194, 239, 78, 0.12); color: var(--color-accent-lime);';
          let subtitle = 'Ready for seating';

          if (status === 'OCCUPIED') {
            borderClass = 'status-occupied';
            badgeStyle = 'background: rgba(250, 127, 170, 0.15); color: var(--color-accent-pink);';
            subtitle = activeOrder ? `Active Order: ${activeOrder.order_number}` : 'Guests seated';
          } else if (status === 'PREPARING') {
            borderClass = 'status-preparing';
            badgeStyle = 'background: rgba(106, 95, 193, 0.2); color: var(--color-accent-violet);';
            subtitle = 'Kitchen cooking';
          } else if (status === 'PAYMENT PENDING') {
            borderClass = 'status-pending';
            badgeStyle = 'background: rgba(245, 158, 11, 0.2); color: var(--color-warning);';
            subtitle = 'Waiting for payment';
          } else if (status === 'CLEANING') {
            borderClass = 'status-cleaning';
            badgeStyle = 'background: rgba(207, 207, 219, 0.2); color: var(--border-cool);';
            subtitle = 'Sanitizing surfaces';
          }

          const card = document.createElement('div');
          card.className = `table-twin-card ${borderClass}`;
          card.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <strong style="font-family: var(--font-display); font-size: 18px;">${tbl.table_number}</strong>
              <span class="badge" style="${badgeStyle}">${status}</span>
            </div>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">Capacity: ${tbl.capacity} Guests • Section: ${tbl.section || 'Main Hall'}</p>
            <span style="font-size: 11px; color: var(--text-tertiary); font-weight: 600;">${subtitle}</span>
          `;

          grid.appendChild(card);
        });

        const score = Math.max(0, Math.min(100, Math.round(
          (availableCount / (tables.length || 1)) * 60 + 40 - (pendingCount * 10)
        )));
        const scoreEl = document.getElementById('health-score');
        if (scoreEl) scoreEl.textContent = `${score}/100`;
      }

      renderFloorMap();
      setInterval(renderFloorMap, 2000);
    });
  </script>

    <!-- Google Identity Services & Auth Modules -->
  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../services/supabaseClient.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="../services/authService.js"></script>
  <script type="module" src="../utils/navbarAuth.js"></script>
</body>
</html>
