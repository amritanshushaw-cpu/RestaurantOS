<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Smart Virtual Queue & Reservation System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .queue-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    .queue-box {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow-card);
    }

    .queue-number {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      color: var(--color-accent-lime);
      margin: 10px 0;
    }

    @media (max-width: 860px) {
      .queue-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Hub</a>
        <a href="queue.html" class="btn-ghost-on-dark active"><i class="fa-solid fa-people-group"></i> Virtual Queue</a>
        <a href="payment.html" class="btn-ghost-on-dark"><i class="fa-solid fa-credit-card"></i> Payment</a>
        <a href="pos.html" class="btn-ghost-on-dark"><i class="fa-solid fa-cash-register"></i> POS Terminal</a>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 1080px; padding-top: 24px;">
    <div class="queue-grid">
      <!-- Virtual Queue Status for Customer -->
      <section class="queue-box" style="text-align: center;">
        <i class="fa-solid fa-clock" style="font-size: 36px; color: var(--color-accent-lime); margin-bottom: 12px;"></i>
        <h2 style="font-family: var(--font-display); font-size: 22px; font-weight: 700;">Virtual Line Status</h2>
        <p style="font-size: 13px; color: var(--text-secondary);">You are currently in the remote waiting line</p>

        <div class="queue-number" id="queue-position">Position #01</div>
        <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(194, 239, 78, 0.12); border: 1px solid rgba(194, 239, 78, 0.3); color: var(--color-accent-lime); padding: 8px 16px; border-radius: var(--radius-xl); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.2px; margin-bottom: 24px;">
          <i class="fa-solid fa-hourglass-half"></i> <span id="queue-wait-time">Est. Wait Time: ~5 mins</span>
        </div>

        <div style="background: var(--color-primary); border: 1px solid var(--border-violet); padding: 16px; border-radius: var(--radius-md); text-align: left; font-size: 13px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: var(--text-secondary);">Diner Name:</span> <strong id="queue-diner-name">Alex Mercer</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: var(--text-secondary);">Party Size:</span> <strong id="queue-party-size">4 Guests</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-secondary);">Seating Preference:</span> <strong>Main Dining Hall</strong>
          </div>
        </div>

        <div style="margin-top: 20px; text-align: left;">
          <h4 style="font-family: var(--font-display); font-size: 14px; font-weight: 700; margin-bottom: 10px;">Current Host-Stand Waiting List</h4>
          <div id="full-queue-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
      </section>

      <!-- Join Queue Form -->
      <aside class="queue-box">
        <h3 style="font-family: var(--font-display); font-size: 16px; font-weight: 700; margin-bottom: 16px;"><i class="fa-solid fa-user-plus" style="color: var(--color-accent-lime);"></i> Join Virtual Queue</h3>

        <form id="queue-form">
          <div class="form-group">
            <label>Your Name</label>
            <div class="input-icon-wrapper">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="q-name" placeholder="e.g. Samantha Reed" required>
            </div>
          </div>

          <div class="form-group">
            <label>Party Size (Number of Guests)</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-users"></i>
              <select id="q-size" style="width: 100%; padding: 10px 14px 10px 40px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans); outline: none;">
                <option value="2">2 Guests</option>
                <option value="4" selected>4 Guests</option>
                <option value="6">6 Guests</option>
                <option value="8">8 Guests (Large Group)</option>
              </select>
            </div>
          </div>

          <button type="submit" class="pay-btn" style="margin-top: 10px;">Join Queue <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </aside>
    </div>
  </main>

  <script type="module">
    import { dbEngine } from '../services/supabaseClient.js';

    document.addEventListener('DOMContentLoaded', () => {
      const posEl = document.getElementById('queue-position');
      const waitEl = document.getElementById('queue-wait-time');
      const nameEl = document.getElementById('queue-diner-name');
      const partyEl = document.getElementById('queue-party-size');
      const listEl = document.getElementById('full-queue-list');
      const form = document.getElementById('queue-form');

      function updateQueueStatus() {
        const queue = dbEngine.getQueue();
        if (queue.length > 0) {
          const current = queue[queue.length - 1];
          const pos = queue.length;
          posEl.textContent = `Position #${pos < 10 ? '0' + pos : pos}`;
          waitEl.textContent = `Est. Wait Time: ~${pos * 5} mins`;
          nameEl.textContent = current.name || 'Alex Mercer';
          partyEl.textContent = `${current.party_size || 4} Guests`;
        } else {
          posEl.textContent = 'Queue Empty';
          waitEl.textContent = 'No wait time';
          nameEl.textContent = '-';
          partyEl.textContent = '-';
        }

        if (listEl) {
          if (queue.length === 0) {
            listEl.innerHTML = `<p style="font-size: 12px; color: var(--text-tertiary);">No guests currently in queue.</p>`;
          } else {
            listEl.innerHTML = queue.map((q, idx) => `
              <div style="display: flex; justify-content: space-between; align-items: center; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px;">
                <span>#${idx + 1} &nbsp; <strong>${q.name}</strong> &nbsp; <span style="color: var(--text-secondary);">(${q.party_size} guests)</span></span>
                <button type="button" class="btn-seat-entry" data-id="${q.id}" style="background: var(--color-accent-lime); color: #000; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer;">Seat</button>
              </div>
            `).join('');

            listEl.querySelectorAll('.btn-seat-entry').forEach(btn => {
              btn.addEventListener('click', () => {
                dbEngine.removeFromQueue(btn.getAttribute('data-id'));
                updateQueueStatus();
              });
            });
          }
        }
      }

      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('q-name').value;
          const size = parseInt(document.getElementById('q-size').value, 10);

          dbEngine.joinQueue({ name, party_size: size });
          updateQueueStatus();
          alert(`Success! ${name}, you have been added to the virtual queue.`);
          form.reset();
        });
      }

      updateQueueStatus();
      setInterval(updateQueueStatus, 2000);
    });
  </script>
</body>
</html>
