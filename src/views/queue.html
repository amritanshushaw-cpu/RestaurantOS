<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Smart Virtual Queue & Reservation System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .queue-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    .queue-box {
      background: var(--bg-dark-surface);
      border: 1px solid var(--bg-dark-border);
      border-radius: var(--radius-lg);
      padding: 28px;
      backdrop-filter: var(--glass-backdrop);
    }

    .queue-number {
      font-size: 48px;
      font-weight: 800;
      color: var(--accent-amber);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <main class="app-container" style="max-width: 1080px;">
    <!-- Navigation -->
    <nav style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-dark-surface); border: 1px solid var(--bg-dark-border); padding: 12px 20px; border-radius: var(--radius-lg); margin-bottom: 24px;">
      <a href="../../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
        <i class="fa-solid fa-house" style="color: var(--accent-amber);"></i>
        <span style="font-weight: 800;">Restaurant<span style="color: var(--accent-amber);">OS</span> Queue & Reservations</span>
      </a>
      <div style="display: flex; gap: 10px;">
        <a href="payment.html" class="btn-chip btn-chip-success" style="text-decoration: none;">Self Checkout</a>
        <a href="pos.html" class="btn-chip btn-chip-otp" style="text-decoration: none;">POS Terminal</a>
      </div>
    </nav>

    <div class="queue-grid">
      <!-- Virtual Queue Status for Customer -->
      <section class="queue-box" style="text-align: center;">
        <i class="fa-solid fa-clock" style="font-size: 36px; color: var(--accent-amber); margin-bottom: 12px;"></i>
        <h2 style="font-size: 22px; font-weight: 800;">Virtual Line Status</h2>
        <p style="font-size: 13px; color: var(--text-secondary);">You are currently in the remote waiting line</p>

        <div class="queue-number" id="queue-position">Position #03</div>
        <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 13px; margin-bottom: 24px;">
          <i class="fa-solid fa-hourglass-half"></i> Est. Wait Time: ~12 mins
        </div>

        <div style="background: rgba(11, 15, 25, 0.5); padding: 16px; border-radius: var(--radius-md); text-align: left; font-size: 13px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span>Diner Name:</span> <strong>Alex Mercer</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span>Party Size:</span> <strong>4 Guests</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span>Seating Preference:</span> <strong>Main Dining Hall</strong>
          </div>
        </div>
      </section>

      <!-- Join Queue Form -->
      <aside class="queue-box">
        <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;"><i class="fa-solid fa-user-plus"></i> Join Virtual Queue</h3>

        <form id="queue-form">
          <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="q-name" placeholder="e.g. Samantha Reed" style="width: 100%; padding: 12px; background: var(--bg-dark-input); border: 1px solid var(--bg-dark-border); border-radius: var(--radius-sm); color: #fff;" required>
          </div>

          <div class="form-group">
            <label>Party Size (Number of Guests)</label>
            <select id="q-size" style="width: 100%; padding: 12px; background: var(--bg-dark-input); border: 1px solid var(--bg-dark-border); border-radius: var(--radius-sm); color: #fff;">
              <option value="2">2 Guests</option>
              <option value="4" selected>4 Guests</option>
              <option value="6">6 Guests</option>
              <option value="8">8 Guests (Large Group)</option>
            </select>
          </div>

          <button type="submit" class="pay-btn" style="margin-top: 10px;">Join Queue <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </aside>
    </div>
  </main>

  <script type="module">
    document.getElementById('queue-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('q-name').value;
      alert(`Success! ${name}, you have been added to the virtual queue at Position #04 (~15 mins wait).`);
    });
  </script>
</body>
</html>
