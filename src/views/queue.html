<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Smart Virtual Queue & Reservation System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .queue-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    .queue-box {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow-card);
    }

    .queue-number {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      color: var(--color-accent-lime);
      margin: 10px 0;
    }

    @media (max-width: 860px) {
      .queue-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Hub</a>
        <a href="queue.html" class="btn-ghost-on-dark active"><i class="fa-solid fa-people-group"></i> Virtual Queue</a>
        <a href="payment.html" class="btn-ghost-on-dark"><i class="fa-solid fa-credit-card"></i> Payment</a>
        <a href="pos.html" class="btn-ghost-on-dark"><i class="fa-solid fa-cash-register"></i> POS Terminal</a>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 1080px; padding-top: 24px;">
    <div class="queue-grid">
      <!-- Virtual Queue Status for Customer -->
      <section class="queue-box" style="text-align: center;">
        <i class="fa-solid fa-clock" style="font-size: 36px; color: var(--color-accent-lime); margin-bottom: 12px;"></i>
        <h2 style="font-family: var(--font-display); font-size: 22px; font-weight: 700;">Virtual Line Status</h2>
        <p style="font-size: 13px; color: var(--text-secondary);" id="queue-empty-msg">Join the queue to see your live position</p>

        <div id="queue-status-block" style="display: none;">
          <div class="queue-number" id="queue-position">Position #--</div>
          <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(194, 239, 78, 0.12); border: 1px solid rgba(194, 239, 78, 0.3); color: var(--color-accent-lime); padding: 8px 16px; border-radius: var(--radius-xl); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.2px; margin-bottom: 24px;">
            <i class="fa-solid fa-hourglass-half"></i> <span id="queue-wait-time">Est. Wait Time: -- mins</span>
          </div>

          <div style="background: var(--color-primary); border: 1px solid var(--border-violet); padding: 16px; border-radius: var(--radius-md); text-align: left; font-size: 13px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="color: var(--text-secondary);">Diner Name:</span> <strong id="queue-diner-name">--</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="color: var(--text-secondary);">Party Size:</span> <strong id="queue-party-size">--</strong>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span style="color: var(--text-secondary);">Status:</span> <strong id="queue-status-label">WAITING</strong>
            </div>
          </div>
          <button type="button" class="btn-chip" id="btn-leave-queue" style="margin-top: 14px;"><i class="fa-solid fa-xmark"></i> Leave Queue</button>
        </div>

        <div style="margin-top: 28px; text-align: left;">
          <h4 style="font-family: var(--font-display); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2px; color: var(--text-secondary); margin-bottom: 10px;">
            <i class="fa-solid fa-people-line"></i> Full Waiting List (Host Stand View)
          </h4>
          <div id="full-queue-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
      </section>

      <!-- Join Queue Form -->
      <aside class="queue-box">
        <h3 style="font-family: var(--font-display); font-size: 16px; font-weight: 700; margin-bottom: 16px;"><i class="fa-solid fa-user-plus" style="color: var(--color-accent-lime);"></i> Join Virtual Queue</h3>

        <form id="queue-form">
          <div class="form-group">
            <label>Your Name</label>
            <div class="input-icon-wrapper">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="q-name" placeholder="e.g. Samantha Reed" required>
            </div>
          </div>

          <div class="form-group">
            <label>Party Size (Number of Guests)</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-users"></i>
              <select id="q-size" style="width: 100%; padding: 10px 14px 10px 40px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans); outline: none;">
                <option value="2">2 Guests</option>
                <option value="4" selected>4 Guests</option>
                <option value="6">6 Guests</option>
                <option value="8">8 Guests (Large Group)</option>
              </select>
            </div>
          </div>

          <button type="submit" class="pay-btn" style="margin-top: 10px;">Join Queue <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </aside>
    </div>
  </main>

  <script type="module">
    import { dbEngine } from '../services/supabaseClient.js';

    const MY_ENTRY_KEY = 'rest_os_my_queue_entry';
    const MINS_PER_PARTY = 5; // rough estimated turnover time used to project wait

    function renderQueue() {
      const queue = dbEngine.getQueue().filter(q => q.status === 'WAITING');
      const listEl = document.getElementById('full-queue-list');
      const emptyMsg = document.getElementById('queue-empty-msg');
      const statusBlock = document.getElementById('queue-status-block');

      // Full waiting list (host-stand view)
      if (queue.length === 0) {
        listEl.innerHTML = `<p style="font-size: 12px; color: var(--text-tertiary);">Queue is empty.</p>`;
      } else {
        listEl.innerHTML = queue.map((q, idx) => `
          <div style="display: flex; justify-content: space-between; align-items: center; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px;">
            <span>#${idx + 1} &nbsp; <strong>${q.name}</strong> &nbsp; <span style="color: var(--text-secondary);">(${q.party_size} guests)</span></span>
            <button type="button" class="btn-chip btn-chip-lime btn-seat-entry" data-id="${q.id}" style="padding: 4px 10px; font-size: 11px;">Seat Now</button>
          </div>
        `).join('');

        listEl.querySelectorAll('.btn-seat-entry').forEach(btn => {
          btn.addEventListener('click', () => {
            dbEngine.removeFromQueue(btn.getAttribute('data-id'));
            renderQueue();
          });
        });
      }

      // My personal position card
      const myEntryId = sessionStorage.getItem(MY_ENTRY_KEY);
      const myEntry = myEntryId ? queue.find(q => q.id === myEntryId) : null;

      if (myEntry) {
        const position = dbEngine.getQueuePosition(myEntry.id);
        emptyMsg.style.display = 'none';
        statusBlock.style.display = 'block';
        document.getElementById('queue-position').textContent = `Position #${String(position).padStart(2, '0')}`;
        document.getElementById('queue-wait-time').textContent = `Est. Wait Time: ~${position * MINS_PER_PARTY} mins`;
        document.getElementById('queue-diner-name').textContent = myEntry.name;
        document.getElementById('queue-party-size').textContent = `${myEntry.party_size} Guests`;
      } else {
        sessionStorage.removeItem(MY_ENTRY_KEY);
        emptyMsg.style.display = 'block';
        statusBlock.style.display = 'none';
      }
    }

    document.getElementById('queue-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('q-name').value.trim();
      const partySize = parseInt(document.getElementById('q-size').value, 10);
      if (!name) return;

      const entry = dbEngine.joinQueue({ name, party_size: partySize });
      sessionStorage.setItem(MY_ENTRY_KEY, entry.id);
      document.getElementById('queue-form').reset();
      renderQueue();
    });

    document.getElementById('btn-leave-queue').addEventListener('click', () => {
      const myEntryId = sessionStorage.getItem(MY_ENTRY_KEY);
      if (myEntryId) {
        dbEngine.removeFromQueue(myEntryId);
        sessionStorage.removeItem(MY_ENTRY_KEY);
      }
      renderQueue();
    });

    document.addEventListener('DOMContentLoaded', renderQueue);
    setInterval(renderQueue, 2000);
  </script>
</body>
</html>
