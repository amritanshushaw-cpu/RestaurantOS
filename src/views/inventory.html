<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Dynamic Inventory & AI Stockout Predictor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .inventory-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 30px;
    }

    .inventory-table th, .inventory-table td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid var(--border-violet);
      font-size: 13px;
    }

    .inventory-table th {
      background: var(--color-primary);
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      font-size: 11px;
    }

    .add-form-box {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 30px;
    }

    @media (max-width: 860px) {
      #add-inventory-form { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 540px) {
      #add-inventory-form { grid-template-columns: 1fr !important; }
      .add-form-box { padding: 16px; }
      .inventory-table th, .inventory-table td { padding: 10px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Hub</a>
        <a href="inventory.html" class="btn-ghost-on-dark active"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="pos.html" class="btn-ghost-on-dark"><i class="fa-solid fa-cash-register"></i> POS Terminal</a>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 1240px; padding-top: 24px; padding-bottom: 80px;">
    <!-- Inventory Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-boxes-stacked" style="color: var(--color-accent-lime);"></i>
        </div>
        <div class="brand-text">
          <h1>Restaurant<span>OS</span> <small style="font-size: 14px; color: var(--text-secondary); font-weight: 500;">/ Dynamic Inventory & AI Stockout Predictor</small></h1>
        </div>
      </div>
    </header>

    <!-- Add New Stock Item Box -->
    <div class="add-form-box">
      <h3 style="font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 16px;">
        <i class="fa-solid fa-plus-circle" style="color: var(--color-accent-lime);"></i> Add Stock Item to Dynamic Inventory
      </h3>
      <form id="add-inventory-form" style="display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 12px; align-items: end;">
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Name</label>
          <input type="text" id="inv-name" placeholder="e.g. Chicken Breast" style="width: 100%; padding: 10px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);" required>
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Quantity</label>
          <input type="number" step="0.1" id="inv-qty" placeholder="10" style="width: 100%; padding: 10px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);" required>
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Unit</label>
          <input type="text" id="inv-unit" placeholder="kg / Liters / Bottles" style="width: 100%; padding: 10px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);" required>
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Min Threshold</label>
          <input type="number" step="0.1" id="inv-thresh" placeholder="5" style="width: 100%; padding: 10px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);" required>
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Supplier</label>
          <input type="text" id="inv-supplier" placeholder="Supplier Co." style="width: 100%; padding: 10px; background: var(--color-primary); border: 1px solid var(--border-violet); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-sans);" required>
        </div>
        <button type="submit" class="pay-btn" style="width: auto; padding: 10px 20px;">+ Add Item</button>
      </form>
    </div>

    <!-- Inventory Data Table -->
    <h3 style="font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 16px;">
      <i class="fa-solid fa-boxes-stacked" style="color: var(--color-accent-lime);"></i> Live Dynamic Stock Table
    </h3>

    <div style="overflow-x: auto;">
      <table class="inventory-table">
        <thead>
          <tr>
            <th>Ingredient Name</th>
            <th>Stock Quantity</th>
            <th>Min Threshold</th>
            <th>Status</th>
            <th>Supplier</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="inventory-tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { dbEngine } from '../services/supabaseClient.js';

    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('inventory-tbody');
      const form = document.getElementById('add-inventory-form');

      function renderInventory() {
        const inventory = dbEngine.getInventory();
        tbody.innerHTML = '';

        inventory.forEach(item => {
          const isLow = item.quantity <= item.threshold;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${item.name}</strong></td>
            <td style="font-family: var(--font-mono);">${item.quantity} ${item.unit}</td>
            <td style="font-family: var(--font-mono);">${item.threshold} ${item.unit}</td>
            <td>
              ${isLow 
                ? `<span class="badge" style="background: rgba(250, 127, 170, 0.2); color: var(--color-accent-pink);">LOW STOCK</span>` 
                : `<span class="badge sandbox-badge">HEALTHY</span>`}
            </td>
            <td>${item.supplier || 'N/A'}</td>
            <td>
              <button class="btn-chip btn-chip-lime btn-add-stock" data-id="${item.id}">+ Restock 5</button>
            </td>
          `;

          tr.querySelector('.btn-add-stock').addEventListener('click', () => {
            dbEngine.updateStockQuantity(item.id, 5);
            renderInventory();
          });

          tbody.appendChild(tr);
        });
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        dbEngine.addIngredient({
          name: document.getElementById('inv-name').value,
          quantity: parseFloat(document.getElementById('inv-qty').value),
          unit: document.getElementById('inv-unit').value,
          threshold: parseFloat(document.getElementById('inv-thresh').value),
          supplier: document.getElementById('inv-supplier').value
        });

        form.reset();
        renderInventory();
      });

      renderInventory();
    });
  </script>

    <!-- Google Identity Services & Auth Modules -->
  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../services/supabaseClient.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="../services/authService.js"></script>
  <script type="module" src="../utils/navbarAuth.js"></script>
</body>
</html>
