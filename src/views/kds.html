<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Kitchen Display System (KDS)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .ticket-card {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .ticket-card.new { border-left: 4px solid var(--color-accent-lime); }
    .ticket-card.preparing { border-left: 4px solid var(--color-accent-violet); }
    .ticket-card.ready { border-left: 4px solid #10b981; }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-violet);
      margin-bottom: 14px;
    }

    .ticket-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .ticket-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .kds-grid {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }
    }

    @media (max-width: 600px) {
      .kds-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 14px;
      }
      .ticket-card {
        padding: 16px;
      }
      .ticket-header {
        flex-direction: row;
        gap: 8px;
      }
      .ticket-item {
        font-size: 13px;
      }
      .kds-grid button {
        width: 100% !important;
        padding: 12px !important;
        font-size: 13px !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 1280px; padding-top: 24px;">
    <!-- KDS Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-fire" style="color: var(--color-accent-pink);"></i>
        </div>
        <div class="brand-text">
          <h1>Restaurant<span>OS</span> <small style="font-size: 14px; color: var(--text-secondary); font-weight: 500;">/ Kitchen Display System (KDS)</small></h1>
        </div>
      </div>
    </header>

    <!-- Live KDS Tickets Container -->
    <div class="kds-grid" id="kds-tickets-container"></div>
  </main>

  <!-- Google Identity Services & Auth Modules -->
  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="../services/supabaseClient.js"></script>
  <script type="module" src="../services/authService.js"></script>
  <script type="module" src="../utils/navbarAuth.js"></script>

  <!-- KDS Controller Module -->
  <script type="module" src="../controllers/kdsController.js"></script>
</body>
</html>
