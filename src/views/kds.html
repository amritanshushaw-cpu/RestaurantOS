<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Kitchen Display System (KDS)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .ticket-card {
      background: var(--bg-dark-surface);
      border: 1px solid var(--bg-dark-border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: var(--glass-backdrop);
    }

    .ticket-card.new { border-left: 4px solid var(--accent-amber); }
    .ticket-card.preparing { border-left: 4px solid #3b82f6; }
    .ticket-card.ready { border-left: 4px solid var(--color-success); }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--bg-dark-border);
      margin-bottom: 14px;
    }

    .ticket-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .ticket-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <main class="app-container" style="max-width: 1280px;">
    <!-- KDS Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
          <i class="fa-solid fa-fire"></i>
        </div>
        <div class="brand-text">
          <h1>Restaurant<span>OS</span> <small style="font-size: 14px; color: var(--text-secondary); font-weight: 500;">/ Kitchen Display System (KDS)</small></h1>
        </div>
      </div>

      <div style="display: flex; gap: 12px;">
        <a href="pos.html" class="btn-chip btn-chip-otp" style="text-decoration: none; padding: 10px 16px;">
          <i class="fa-solid fa-cash-register"></i> Back to POS
        </a>
        <a href="analytics.html" class="btn-chip btn-chip-success" style="text-decoration: none; padding: 10px 16px;">
          <i class="fa-solid fa-chart-line"></i> AI Analytics
        </a>
      </div>
    </header>

    <!-- Live KDS Tickets Container -->
    <div class="kds-grid" id="kds-tickets-container">
      <!-- Tickets populated dynamically by kdsController.js -->
    </div>
  </main>

  <script type="module" src="../controllers/kdsController.js"></script>
</body>
</html>
