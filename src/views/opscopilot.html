<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - OpsCopilot AI Manager Assistant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .copilot-card {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 24px;
      height: 540px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
      padding-right: 6px;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      line-height: 1.5;
    }

    .bubble-copilot {
      background: var(--color-primary);
      border: 1px solid var(--border-violet);
      color: var(--text-primary);
      align-self: flex-start;
    }

    .bubble-user {
      background: var(--color-accent-lime);
      color: var(--color-ink-deep);
      font-weight: 700;
      align-self: flex-end;
    }

    .quick-prompts {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .prompt-chip {
      background: var(--color-primary);
      border: 1px solid var(--border-violet);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: var(--radius-xl);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .prompt-chip:hover {
      border-color: var(--color-accent-lime);
      color: var(--color-accent-lime);
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Hub</a>
        <a href="opscopilot.html" class="btn-ghost-on-dark active"><i class="fa-solid fa-robot"></i> OpsCopilot</a>
        <a href="inventory.html" class="btn-ghost-on-dark"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="analytics.html" class="btn-ghost-on-dark"><i class="fa-solid fa-chart-line"></i> Analytics</a>
        <a href="pos.html" class="btn-ghost-on-dark"><i class="fa-solid fa-cash-register"></i> POS Terminal</a>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 960px; padding-top: 24px;">
    <div class="copilot-card">
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border-violet); margin-bottom: 16px;">
        <div class="brand-icon" style="width: 40px; height: 40px; font-size: 18px;"><i class="fa-solid fa-robot"></i></div>
        <div>
          <h3 style="font-family: var(--font-display); font-size: 18px; font-weight: 700;">OpsCopilot AI Assistant</h3>
          <span style="font-size: 11px; color: var(--color-accent-lime); text-transform: uppercase; letter-spacing: 0.2px;"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> Connected to Live Inventory & Orders</span>
        </div>
      </div>

      <div class="chat-history" id="chat-history">
        <div class="chat-bubble bubble-copilot" id="copilot-greeting">
          <strong>OpsCopilot:</strong> Hello Manager! Analyzing today's operational data...
        </div>
      </div>

      <!-- Quick Prompts -->
      <div class="quick-prompts">
        <button class="prompt-chip" data-prompt="What should I prepare for tonight?">What to prepare tonight?</button>
        <button class="prompt-chip" data-prompt="Which items are likely to sell out?">Which items will sell out?</button>
        <button class="prompt-chip" data-prompt="How can I reduce food waste?">Reduce food waste tips</button>
      </div>

      <form id="copilot-form" style="display: flex; gap: 10px;">
        <div class="input-icon-wrapper" style="flex: 1;">
          <i class="fa-solid fa-message"></i>
          <input type="text" id="copilot-input" placeholder="Ask OpsCopilot about inventory, tables, or sales..." style="padding-left: 40px;">
        </div>
        <button type="submit" class="pay-btn" style="width: auto; padding: 12px 24px;">Ask AI <i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </main>

  <script type="module">
    import { geminiService } from '../services/geminiService.js';
    import { dbEngine } from '../services/supabaseClient.js';

    // Build a generalized snapshot of live restaurant state — no hardcoded numbers or item names
    function getLiveContext() {
      const inventory = dbEngine.getInventory();
      const lowStock = inventory
        .filter(i => i.quantity <= i.threshold)
        .sort((a, b) => (a.quantity / (a.threshold || 1)) - (b.quantity / (b.threshold || 1)));

      const summary = dbEngine.getAnalyticsSummary();
      const { items } = dbEngine.getMenu();
      const orders = dbEngine.getOrders();

      // Top seller derived from actual quantities sold across all orders
      const soldQty = {};
      orders.forEach(o => (o.items || []).forEach(line => {
        soldQty[line.name] = (soldQty[line.name] || 0) + line.quantity;
      }));
      let topSeller = null, topSellerQty = 0;
      Object.entries(soldQty).forEach(([name, qty]) => {
        if (qty > topSellerQty) { topSeller = name; topSellerQty = qty; }
      });

      return { inventory, lowStock, summary, items, topSeller, topSellerQty };
    }

    function renderGreeting() {
      const ctx = getLiveContext();
      const greeting = document.getElementById('copilot-greeting');
      const topSellerLine = ctx.topSeller
        ? `${ctx.topSeller} is your top seller so far today.`
        : `No orders yet today — I'll surface trends as they come in.`;
      const stockLine = ctx.lowStock.length > 0
        ? `Heads up: ${ctx.lowStock[0].name} is running low (${ctx.lowStock[0].quantity} ${ctx.lowStock[0].unit} left).`
        : `All ingredients are above their restock threshold right now.`;
      greeting.innerHTML = `<strong>OpsCopilot:</strong> Hello Manager! ${topSellerLine} ${stockLine} How can I assist your dinner service?`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderGreeting();

      const history = document.getElementById('chat-history');
      const form = document.getElementById('copilot-form');
      const input = document.getElementById('copilot-input');

      document.querySelectorAll('.prompt-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          input.value = chip.getAttribute('data-prompt');
          form.dispatchEvent(new Event('submit'));
        });
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        // Add User Bubble
        const userB = document.createElement('div');
        userB.className = 'chat-bubble bubble-user';
        userB.textContent = text;
        history.appendChild(userB);

        input.value = '';
        history.scrollTop = history.scrollHeight;

        const lowerText = text.toLowerCase();
        const ctx = getLiveContext();

        setTimeout(async () => {
          const aiB = document.createElement('div');
          aiB.className = 'chat-bubble bubble-copilot';

          if (lowerText.includes('prepare') || lowerText.includes('tonight')) {
            if (ctx.topSeller) {
              const pairing = await geminiService.getPairingRecommendation(ctx.topSeller);
              aiB.innerHTML = `<strong>OpsCopilot:</strong> Based on today's ${ctx.summary.orderCount} order(s), ${ctx.topSeller} (${ctx.topSellerQty} sold) is leading demand. Consider prepping extra stock and pairing it with ${pairing.side} and ${pairing.beverage}.`;
            } else {
              aiB.innerHTML = `<strong>OpsCopilot:</strong> No orders have come in yet today, so I don't have a demand signal. Once the POS Terminal sends tickets, I'll recommend prep priorities.`;
            }
          } else if (lowerText.includes('sell out') || lowerText.includes('stock')) {
            if (ctx.lowStock.length > 0) {
              const list = ctx.lowStock.slice(0, 3).map((i, idx) => `${idx + 1}. ${i.name} (${i.quantity} ${i.unit} left, threshold ${i.threshold})`).join(', ');
              aiB.innerHTML = `<strong>OpsCopilot:</strong> High risk of stockout for: ${list}. Recommended action: restock before the dinner rush.`;
            } else {
              aiB.innerHTML = `<strong>OpsCopilot:</strong> Good news — every ingredient is currently above its restock threshold. No stockout risk detected.`;
            }
          } else if (lowerText.includes('waste')) {
            aiB.innerHTML = `<strong>OpsCopilot:</strong> To reduce waste, prep perishables in smaller batches matched to today's ${ctx.summary.orderCount}-order pace, and rotate ${ctx.inventory[0]?.name || 'high-turnover ingredients'} using first-in-first-out storage.`;
          } else {
            aiB.innerHTML = `<strong>OpsCopilot:</strong> Live Data Insight: Average check is $${ctx.summary.avgCheck.toFixed(2)} across ${ctx.summary.orderCount} order(s) today, with gross revenue of $${ctx.summary.grossRevenue.toFixed(2)}.`;
          }

          history.appendChild(aiB);
          history.scrollTop = history.scrollHeight;
        }, 600);
      });
    });
  </script>

    <!-- Google Identity Services & Auth Modules -->
  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../services/supabaseClient.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="../services/authService.js"></script>
  <script type="module" src="../utils/navbarAuth.js"></script>
</body>
</html>
