<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-primary);
      color: #fff;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-elevation-3);
    }

    .google-btn {
      width: 100%;
      background: var(--color-primary);
      border: 1px solid var(--border-violet);
      color: #fff;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .google-btn:hover {
      border-color: var(--color-accent-lime);
      background: rgba(255, 255, 255, 0.05);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-tertiary);
      font-size: 11px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border-violet);
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>
  <div class="bg-glow bg-glow-pink"></div>

  <!-- Header -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>
      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Home</a>
      </div>
    </div>
  </header>

  <!-- Login Container -->
  <div class="login-wrapper">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <span class="badge sandbox-badge" id="mode-badge" style="background: rgba(194, 239, 78, 0.15); color: var(--color-accent-lime); font-size: 11px; text-transform: uppercase;">
        </span>
        <h2 style="font-size: 22px; font-weight: 700; margin-top: 8px;">Sign In to Account</h2>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
          Choose your sign in option to access your workspace
        </p>
      </div>

      <!-- Option 1: Google Authentication -->
      <button type="button" class="google-btn" id="btn-google-signin">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span style="padding: 0 12px; text-transform: uppercase; color: var(--text-tertiary);">OR EMAIL SIGN IN</span>
        <div class="divider-line"></div>
      </div>

      <!-- Option 2: Email Sign In -->
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <input type="email" id="signin-email" placeholder="Email address" class="sentry-input-sm" required>
        <button id="btn-submit-signin" class="btn-sentry" style="width: 100%; padding: 12px; margin-top: 4px;">
          Send Magic Link <i class="fa-solid fa-envelope"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../services/supabaseClient.js"></script>
  <script type="module" src="../services/authService.js"></script>

  <script type="module">
    import { authService } from '../services/authService.js';

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get('role') || 'Customer';
      const activeRole = ['Manager', 'Customer', 'Waiter', 'Kitchen'].includes(roleParam) ? roleParam : 'Customer';

      const modeBadge = document.getElementById('mode-badge');
      if (modeBadge) modeBadge.textContent = `MODE: ${activeRole}`;

      // Option 1: Google Sign In
      document.getElementById('btn-google-signin')?.addEventListener('click', () => {
        authService.loginWithGoogle(activeRole);
      });

      // Option 2: Email Sign In (OTP / Magic Link)
      document.getElementById('btn-submit-signin')?.addEventListener('click', async () => {
        const email = document.getElementById('signin-email').value.trim();
        const btn = document.getElementById('btn-submit-signin');

        if (!email) {
          authService.showToast('Please enter an email address.');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending link...';

        const res = await authService.loginWithOtp(email, activeRole);
        
        if (res.ok) {
          btn.innerHTML = 'Link Sent! <i class="fa-solid fa-check"></i>';
        } else {
          btn.disabled = false;
          btn.innerHTML = 'Send Magic Link <i class="fa-solid fa-envelope"></i>';
        }
      });

      function redirectForRole(role) {
        if (role === 'Manager') window.location.href = 'analytics.html';
        else if (role === 'Waiter') window.location.href = 'kds.html?role=waiter';
        else if (role === 'Kitchen') window.location.href = 'kds.html?role=kitchen';
        else window.location.href = 'customer.html';
      }
    });
  </script>
</body>
</html>
