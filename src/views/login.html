<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Dedicated Sign Up & Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-primary);
      color: #fff;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-elevation-3);
    }

    .role-grid-select {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn-role-tile {
      background: var(--color-primary);
      border: 1px solid var(--border-violet);
      color: var(--text-secondary);
      padding: 10px 4px;
      border-radius: var(--radius-md);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-role-tile.active {
      border-color: var(--color-accent-lime);
      color: var(--color-accent-lime);
      background: rgba(194, 239, 78, 0.08);
    }

    .auth-tab-bar {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border-violet);
      margin-bottom: 20px;
      padding-bottom: 8px;
    }

    .auth-tab-item {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 12px;
      position: relative;
    }

    .auth-tab-item.active {
      color: var(--color-accent-lime);
      border-bottom: 2px solid var(--color-accent-lime);
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>
  <div class="bg-glow bg-glow-pink"></div>

  <!-- Header -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>
      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Home Hub</a>
      </div>
    </div>
  </header>

  <!-- Login Container -->
  <div class="login-wrapper">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 32px; color: var(--color-accent-lime); margin-bottom: 8px;">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 style="font-size: 24px; font-weight: 700;">Account Authentication</h2>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
          Real Supabase GoTrue Auth (Email-OTP / Google OAuth)
        </p>
      </div>

      <!-- Step 1: Mode / Role Selector -->
      <label style="font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 8px;">
        Select Access Mode / Role:
      </label>
      <div class="role-grid-select" id="role-select-grid">
        <button type="button" class="btn-role-tile active" data-role="Customer">
          <i class="fa-solid fa-user" style="font-size: 16px;"></i> Customer
        </button>
        <button type="button" class="btn-role-tile" data-role="Manager">
          <i class="fa-solid fa-user-tie" style="font-size: 16px;"></i> Manager
        </button>
        <button type="button" class="btn-role-tile" data-role="Waiter">
          <i class="fa-solid fa-concierge-bell" style="font-size: 16px;"></i> Waiter
        </button>
        <button type="button" class="btn-role-tile" data-role="Kitchen">
          <i class="fa-solid fa-fire" style="font-size: 16px;"></i> Kitchen
        </button>
      </div>

      <!-- Auth Method Tabs -->
      <div class="auth-tab-bar">
        <button type="button" class="auth-tab-item active" data-tab="otp">
          <i class="fa-solid fa-paper-plane"></i> Email OTP
        </button>
        <button type="button" class="auth-tab-item" data-tab="pass">
          <i class="fa-solid fa-key"></i> Email & Password
        </button>
      </div>

      <!-- Method 1: Email OTP (Real Code Sent to Email) -->
      <div id="tab-otp-panel">
        <div id="otp-step-send">
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <label style="font-size: 12px; color: var(--text-secondary);">Enter your email to receive a real-time OTP code:</label>
            <input type="email" id="login-otp-email" placeholder="name@example.com" class="sentry-input-sm" required>
            <button id="btn-send-real-otp" class="btn-sentry" style="width: 100%; padding: 12px;">
              <i class="fa-solid fa-paper-plane"></i> Send Real OTP Code
            </button>
          </div>
        </div>

        <div id="otp-step-verify" style="display: none;">
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <label style="font-size: 12px; color: var(--text-secondary);" id="lbl-otp-sent-email">Enter 6-digit verification code:</label>
            <input type="text" id="login-otp-code" placeholder="6-digit code" maxlength="6" class="sentry-input-sm" style="font-family: var(--font-mono); letter-spacing: 4px; text-align: center; font-size: 18px;" required>
            <button id="btn-verify-real-otp" class="btn-sentry" style="width: 100%; padding: 12px;">
              <i class="fa-solid fa-check"></i> Verify & Authenticate
            </button>
          </div>
        </div>
      </div>

      <!-- Method 2: Email & Password -->
      <div id="tab-pass-panel" style="display: none;">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <input type="text" id="login-name-input" placeholder="Full Name (for new sign up)" class="sentry-input-sm">
          <input type="email" id="login-pass-email" placeholder="Email address" class="sentry-input-sm" required>
          <input type="password" id="login-pass-secret" placeholder="Password (min 6 chars)" class="sentry-input-sm" required>

          <div style="display: flex; gap: 10px; margin-top: 6px;">
            <button id="btn-pass-signin" class="btn-sentry" style="flex: 1; padding: 10px;">
              <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
            <button id="btn-pass-signup" class="btn-ghost-sm" style="flex: 1; border: 1px solid var(--border-violet); padding: 10px;">
              <i class="fa-solid fa-user-plus"></i> Sign Up
            </button>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div style="display: flex; align-items: center; margin: 20px 0; color: var(--text-tertiary); font-size: 11px;">
        <div style="flex:1; height:1px; background: var(--border-violet);"></div>
        <span style="padding: 0 10px; text-transform: uppercase;">OR REAL GOOGLE AUTH</span>
        <div style="flex:1; height:1px; background: var(--border-violet);"></div>
      </div>

      <!-- Google OAuth -->
      <button type="button" id="btn-google-real-auth" class="btn-ghost-sm" style="width: 100%; padding: 12px; border: 1px solid var(--border-violet); display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <strong style="color: #fff; font-size: 14px;">Sign in with Google Account</strong>
      </button>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../services/supabaseClient.js"></script>
  <script type="module" src="../services/authService.js"></script>

  <script type="module">
    import { authService } from '../services/authService.js';

    document.addEventListener('DOMContentLoaded', () => {
      let activeRole = 'Customer';
      let activeOtpEmail = '';

      // Role Selection
      document.querySelectorAll('.btn-role-tile').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.btn-role-tile').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeRole = btn.dataset.role;
        });
      });

      // Tab Switching
      document.querySelectorAll('.auth-tab-item').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.auth-tab-item').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const target = tab.dataset.tab;
          document.getElementById('tab-otp-panel').style.display = target === 'otp' ? 'block' : 'none';
          document.getElementById('tab-pass-panel').style.display = target === 'pass' ? 'block' : 'none';
        });
      });

      // Send Real Email OTP Code
      document.getElementById('btn-send-real-otp')?.addEventListener('click', async () => {
        const email = document.getElementById('login-otp-email').value.trim();
        if (!email) return;
        activeOtpEmail = email;

        const btn = document.getElementById('btn-send-real-otp');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending real OTP...';

        const res = await authService.sendEmailOtp(email);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Real OTP Code';

        if (res.ok) {
          document.getElementById('otp-step-send').style.display = 'none';
          document.getElementById('otp-step-verify').style.display = 'block';
          document.getElementById('lbl-otp-sent-email').textContent = `Enter the 6-digit code sent to ${email}:`;
        }
      });

      // Verify Real Email OTP Code
      document.getElementById('btn-verify-real-otp')?.addEventListener('click', async () => {
        const token = document.getElementById('login-otp-code').value.trim();
        if (!token) return;

        const btn = document.getElementById('btn-verify-real-otp');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

        const res = await authService.verifyEmailOtp(activeOtpEmail, token, activeRole);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Verify & Authenticate';

        if (res.ok) {
          redirectForRole(activeRole);
        }
      });

      // Password Sign In
      document.getElementById('btn-pass-signin')?.addEventListener('click', async () => {
        const email = document.getElementById('login-pass-email').value.trim();
        const password = document.getElementById('login-pass-secret').value;
        const btn = document.getElementById('btn-pass-signin');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

        const res = await authService.loginWithEmailPassword(email, password, activeRole);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';

        if (res.ok) {
          redirectForRole(activeRole);
        }
      });

      // Password Sign Up
      document.getElementById('btn-pass-signup')?.addEventListener('click', async () => {
        const name = document.getElementById('login-name-input').value.trim();
        const email = document.getElementById('login-pass-email').value.trim();
        const password = document.getElementById('login-pass-secret').value;
        const btn = document.getElementById('btn-pass-signup');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

        const res = await authService.signUpWithEmailPassword(email, password, name, activeRole);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up';

        if (res.ok) {
          redirectForRole(activeRole);
        }
      });

      // Google OAuth Action
      document.getElementById('btn-google-real-auth')?.addEventListener('click', () => {
        authService.loginWithGoogle(activeRole);
      });

      function redirectForRole(role) {
        if (role === 'Manager') window.location.href = 'analytics.html';
        else if (role === 'Waiter') window.location.href = 'kds.html?role=waiter';
        else if (role === 'Kitchen') window.location.href = 'kds.html?role=kitchen';
        else window.location.href = 'customer.html';
      }
    });
  </script>
</body>
</html>
