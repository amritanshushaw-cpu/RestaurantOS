<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS - Restaurant Digital Twin Floor Plan Map</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">

  <style>
    .floorplan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .table-twin-card {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 24px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .table-twin-card:hover {
      transform: translateY(-3px);
      border-color: var(--color-accent-lime);
      box-shadow: var(--shadow-card);
    }

    .status-available { border-top: 4px solid var(--color-accent-lime); }
    .status-occupied { border-top: 4px solid var(--color-accent-pink); }
    .status-preparing { border-top: 4px solid var(--color-accent-violet); }
    .status-pending { border-top: 4px solid var(--color-warning); }
    .status-cleaning { border-top: 4px solid var(--border-cool); }

    .health-score-banner {
      background: var(--color-ink-deep);
      border: 1px solid var(--border-violet);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .score-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 3px solid var(--color-accent-lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--color-accent-lime);
    }

    @media (max-width: 860px) {
      .floorplan-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-amber"></div>

  <!-- Global Sentry Navigation Bar -->
  <header class="sentry-navbar">
    <div class="sentry-navbar-inner">
      <a href="../../index.html" class="sentry-brand">
        <div class="brand-logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span>Restaurant<span class="brand-highlight">OS</span></span>
      </a>

      <div class="sentry-nav-links">
        <a href="../../index.html" class="btn-ghost-on-dark"><i class="fa-solid fa-house"></i> Hub</a>
        <a href="digital_twin.html" class="btn-ghost-on-dark active"><i class="fa-solid fa-cubes"></i> Digital Twin</a>
        <a href="pos.html" class="btn-ghost-on-dark"><i class="fa-solid fa-cash-register"></i> POS Terminal</a>
        <a href="kds.html" class="btn-ghost-on-dark"><i class="fa-solid fa-fire"></i> KDS Kitchen</a>
        <a href="opscopilot.html" class="btn-ghost-on-dark"><i class="fa-solid fa-robot"></i> OpsCopilot</a>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 1200px; padding-top: 24px;">
    <!-- Health Score Banner -->
    <div class="health-score-banner">
      <div>
        <div style="font-size: 11px; font-weight: 600; color: var(--color-accent-lime); text-transform: uppercase; letter-spacing: 0.2px; margin-bottom: 6px;">
          <i class="fa-solid fa-heart-pulse"></i> Operational Bottleneck Detection Engine
        </div>
        <h2 style="font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-bottom: 6px;">Restaurant Operational Health Score</h2>
        <p style="font-size: 14px; color: var(--text-secondary);" id="health-detail">Loading live floor status...</p>
      </div>
      <div class="score-circle" id="health-score">--/100</div>
    </div>

    <!-- Digital Twin Floor Plan Map -->
    <h3 style="font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: 20px;">
      <i class="fa-solid fa-map-location-dot" style="color: var(--color-accent-lime);"></i> <span id="floorplan-heading">Live Floor Plan</span>
    </h3>

    <div class="floorplan-grid" id="floorplan-grid"></div>
  </main>

  <script type="module">
    import { dbEngine } from '../services/supabaseClient.js';

    const STATUS_META = {
      AVAILABLE:  { cls: 'status-available', badge: 'badge sandbox-badge', label: 'AVAILABLE' },
      OCCUPIED:   { cls: 'status-occupied', badge: '', style: 'background: rgba(250, 127, 170, 0.15); color: var(--color-accent-pink);', label: 'OCCUPIED' },
      PREPARING:  { cls: 'status-preparing', badge: '', style: 'background: rgba(106, 95, 193, 0.2); color: var(--color-accent-violet);', label: 'PREPARING' },
      PAYMENT_PENDING: { cls: 'status-pending', badge: '', style: 'background: rgba(245, 158, 11, 0.2); color: var(--color-warning);', label: 'PAYMENT PENDING' },
      CLEANING:   { cls: 'status-cleaning', badge: '', style: 'background: rgba(207, 207, 219, 0.2); color: var(--border-cool);', label: 'CLEANING' },
      RESERVED:   { cls: 'status-pending', badge: '', style: 'background: rgba(245, 158, 11, 0.2); color: var(--color-warning);', label: 'RESERVED' }
    };

    function timeAgo(iso) {
      const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
      return mins <= 1 ? 'just now' : `${mins} mins ago`;
    }

    function renderFloorPlan() {
      const tables = dbEngine.getTables();
      const orders = dbEngine.getOrders();
      const grid = document.getElementById('floorplan-grid');

      document.getElementById('floorplan-heading').textContent = `Live Floor Plan (${tables.length} Active Dining Tables)`;
      grid.innerHTML = '';

      let availableCount = 0;
      let paymentPendingCount = 0;

      tables.forEach(table => {
        // Derive live status from the most recent open order on this table, if any
        const openOrder = orders.find(o => o.table_id === table.id && o.status !== 'PAID' && o.status !== 'CANCELLED');
        let liveStatus = table.status;
        let detail = `Capacity: ${table.capacity} Guests • Section: ${table.section || 'Main Hall'}`;
        let footnote = liveStatus === 'AVAILABLE' ? 'Ready for seating' : '';

        if (openOrder) {
          if (openOrder.status === 'READY') {
            liveStatus = 'PAYMENT_PENDING';
            detail = `Order ${openOrder.order_number} • Bill Ready ($${parseFloat(openOrder.total).toFixed(2)})`;
            footnote = 'Waiting for payment';
          } else if (openOrder.status === 'PREPARING') {
            liveStatus = 'PREPARING';
            detail = `Order ${openOrder.order_number} • Kitchen KDS Cooking`;
            footnote = 'In the kitchen';
          } else {
            liveStatus = 'OCCUPIED';
            detail = `Order ${openOrder.order_number} • Sent ${timeAgo(openOrder.created_at)}`;
            footnote = `Seated ${timeAgo(openOrder.created_at)}`;
          }
        }

        if (liveStatus === 'AVAILABLE') availableCount++;
        if (liveStatus === 'PAYMENT_PENDING') paymentPendingCount++;

        const meta = STATUS_META[liveStatus] || STATUS_META.AVAILABLE;
        const card = document.createElement('div');
        card.className = `table-twin-card ${meta.cls}`;
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <strong style="font-family: var(--font-display); font-size: 18px;">${table.table_number}</strong>
            <span class="${meta.badge}" style="${meta.style || ''}">${meta.label}</span>
          </div>
          <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">${detail}</p>
          <span style="font-size: 11px; color: var(--text-tertiary);">${footnote}</span>
        `;
        grid.appendChild(card);
      });

      // Health score: derived from % available + a penalty for tables stuck waiting on payment
      const score = Math.max(0, Math.min(100, Math.round(
        (availableCount / tables.length) * 60 + 40 - (paymentPendingCount * 10)
      )));
      document.getElementById('health-score').textContent = `${score}/100`;
      document.getElementById('health-detail').textContent = paymentPendingCount > 0
        ? `${paymentPendingCount} table(s) waiting on payment — head to the Payment enclave to clear them.`
        : 'All active tickets are flowing smoothly through the kitchen.';
    }

    document.addEventListener('DOMContentLoaded', renderFloorPlan);
    setInterval(renderFloorPlan, 2000);
  </script>
</body>
</html>
